name: RestoStream CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restostream-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Maven build, unit tests, integration tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker for Testcontainers
        run: docker version

      - name: Build and run complete test suite
        run: mvn --batch-mode --no-transfer-progress --show-version clean verify

      - name: Upload Surefire, Failsafe and JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restostream-test-and-coverage-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
            target/site/jacoco-merged/**
            target/*.jar
