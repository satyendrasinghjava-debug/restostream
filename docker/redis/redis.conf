# Redis configuration for RestoStream.

bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 60
timeout 0

################################# KEYSPACE EVENTS ##############################
#
# THIS IS THE LOAD-BEARING LINE OF THIS FILE.
#
# `Ex` enables keyspace notifications for expired keys, which is how RestoStream learns within
# milliseconds that an SLA deadline has elapsed:
#
#   K  keyspace events          E  keyevent events          x  expired events
#
# RestoStream subscribes to the pattern `__keyevent@*__:expired`, so `Ex` is the minimum that works.
#
# If this line is removed, the service does NOT lose alerts — the reconciliation sweeper detects
# every breach from the persistent deadline sorted set regardless. What is lost is latency: breach
# detection degrades from sub-second to one sweep interval. That graceful degradation is deliberate,
# because a cache misconfiguration must never be able to silence a service alert.
notify-keyspace-events Ex

################################# PERSISTENCE ##################################
#
# SLA deadlines and table state are operational truth for a live dining room, not a cache that can
# be rebuilt from somewhere else. The append-only file with per-second fsync is the right trade:
# a crash costs at most one second of transitions instead of the entire floor plan.
appendonly yes
appendfsync everysec
appendfilename "restostream.aof"
dir /data

save 900 1
save 300 10
save 60 10000

################################# MEMORY #######################################
#
# `noeviction` is mandatory, not a preference. Under `allkeys-lru` Redis would be free to evict an
# SLA timer key or a table snapshot to reclaim memory, and a silently evicted deadline is an alert
# that never fires. Failing writes loudly is strictly better than losing state quietly.
maxmemory 512mb
maxmemory-policy noeviction

################################# LOGGING ######################################
loglevel notice
